# Enables the ESP32 WiFi driver. This is the only board-specific piece of
# the fetch sample: main.c uses only portable Zephyr networking APIs
# (net_mgmt, sockets, http_client), so porting to another WiFi-capable board
# should only require adding an equivalent boards/<board>.conf here.
CONFIG_WIFI_ESP32=y

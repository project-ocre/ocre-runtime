# Logging
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y

# Filesystem
CONFIG_ZVFS_POLL_MAX=11
CONFIG_ZVFS_OPEN_MAX=16

# Memory options
CONFIG_DYNAMIC_THREAD_STACK_SIZE=8192
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYS_HEAP_RUNTIME_STATS=y

# sys_reboot(): a code update reboots the whole board to run it, rather than
# swapping the container in place.
CONFIG_REBOOT=y

# Zephyr's POSIX layer hands out pthread mutexes/conds from small fixed-size
# pools (default 5): ocre_common, ocre_dispatch, ocre_http, container.c, and
# ocre.c/context.c between them statically declare more than that, so the
# default silently runs out (pthread_mutex_init returns ENOMEM) the moment a
# container is actually created with GPIO+ADC+HTTP all enabled together.
CONFIG_MAX_PTHREAD_MUTEX_COUNT=16
CONFIG_MAX_PTHREAD_COND_COUNT=16

# Networking (portable, board-agnostic; the WiFi driver itself is enabled
# per-board under boards/*.conf, since it differs per SoC).
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_HTTP_CLIENT=y

# Both defaulted small (4 connections, 6 contexts) and shared between the
# native HTTP server (a listener plus up to CONFIG_HTTP_SERVER_MAX_CLIENTS
# accepted connections) and this sample's own outbound hash/code fetches
# (each check opens and closes its own client connection, which then sits
# in TIME_WAIT for CONFIG_NET_TCP_TIME_WAIT_DELAY ms). At the default pool
# sizes, frequent checks plus a few retries could exhaust the pool faster
# than TIME_WAIT entries free back up, making every subsequent connect()
# fail until something ages out -- raised well past the sum of everything
# that can be in flight at once.
CONFIG_NET_MAX_CONN=10
CONFIG_NET_MAX_CONTEXTS=12

CONFIG_WIFI=y
CONFIG_NET_L2_WIFI_MGMT=y

# Automatically start a DHCPv4 client once the network interface comes up.
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_DHCPV4=y

# Native HTTP server backing the container's onRequest() export (see the
# ocre-as CLI / AssemblyScript bindings). Portable Zephyr subsystem, no
# board-specific config needed.
CONFIG_HTTP_SERVER=y
CONFIG_HTTP_SERVER_MAX_CLIENTS=4
CONFIG_HTTP_PARSER=y
CONFIG_HTTP_PARSER_URL=y
CONFIG_OCRE_HTTP_SERVER=y

# Outbound HTTP client API (ocre_http_get()), demonstrated in gpio-demo by
# polling the same host's /getHash endpoint from within loop(). Shares
# CONFIG_HTTP_CLIENT with this sample's own native update-fetch code above.
CONFIG_OCRE_HTTP_CLIENT=y

# GPIO and analog-input (ADC) native APIs. GPIO by-name aliases (led0, sw0,
# ...) and the ADC "zephyr,user" io-channels overlay are both resolved from
# devicetree, so containers built for this API run unmodified on any board
# that defines the same names -- see boards/*.overlay for this board's ADC
# channel mapping.
CONFIG_OCRE_GPIO=y
CONFIG_ADC=y
CONFIG_OCRE_ADC=y

# Ocre configuration
CONFIG_OCRE=y
